name: Build macOS Release
run-name: Build macOS ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: macOS architecture to build
        required: true
        default: all
        type: choice
        options:
          - all
          - x86_64
          - arm64

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    name: Build Intel macOS package
    if: ${{ inputs.target == 'all' || inputs.target == 'x86_64' }}
    runs-on: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: tools/mitm_proxy/go.sum

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Build x86_64 DMG and ZIP
        run: bash scripts/build_macos_arch.sh x86_64

      - name: Show package metadata
        run: |
          echo "### macOS x86_64 package" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build_output/SHA256SUMS-x86_64.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          file build_output/x86_64/AntigravityProxyLauncher.app/Contents/MacOS/AntigravityProxyLauncher >> "$GITHUB_STEP_SUMMARY"
          file build_output/x86_64/AntigravityProxyLauncher.app/Contents/Resources/libAntigravityTun.dylib >> "$GITHUB_STEP_SUMMARY"
          file build_output/x86_64/AntigravityProxyLauncher.app/Contents/Resources/mitm_proxy >> "$GITHUB_STEP_SUMMARY"

      - name: Upload x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityProxyLauncher-macos-x86_64
          path: |
            build_output/*-macos_x86_64.dmg
            build_output/*-macos_x86_64.zip
            build_output/SHA256SUMS-x86_64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-arm64:
    name: Build Apple Silicon macOS package
    if: ${{ inputs.target == 'all' || inputs.target == 'arm64' }}
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: tools/mitm_proxy/go.sum

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Build arm64 DMG and ZIP
        run: bash scripts/build_macos_arch.sh arm64

      - name: Show package metadata
        run: |
          echo "### macOS arm64 package" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build_output/SHA256SUMS-arm64.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          file build_output/arm64/AntigravityProxyLauncher.app/Contents/MacOS/AntigravityProxyLauncher >> "$GITHUB_STEP_SUMMARY"
          file build_output/arm64/AntigravityProxyLauncher.app/Contents/Resources/libAntigravityTun.dylib >> "$GITHUB_STEP_SUMMARY"
          file build_output/arm64/AntigravityProxyLauncher.app/Contents/Resources/mitm_proxy >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityProxyLauncher-macos-arm64
          path: |
            build_output/*-macos_arm64.dmg
            build_output/*-macos_arm64.zip
            build_output/SHA256SUMS-arm64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
